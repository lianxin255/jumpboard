    '@electron-toolkit/utils': ^3.0.0
    '@types/better-sqlite3': ^7.6.13
    '@types/fs-extra': ^11.0.4
    '@types/ssh2': ^1.15.5
    '@vitejs/plugin-vue': ^5.2.4
    '@vue/test-utils': ^2.4.11
    electron: ^33.0.0
    electron-builder: ^25.0.0
    electron-vite: ^2.3.0
    jsdom: ^25.0.1

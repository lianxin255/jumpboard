# 由 JumpBoard 自动生成，请勿手动编辑
# 生成时间: 2026-10-20T12:00:00.000Z
worker_processes 1;
error_log logs/error.log warn;
pid temp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  proxy_http_version 1.1;
  client_max_body_size 0;
  proxy_read_timeout 300s;
  proxy_buffering off;
  access_log logs/access.log;
  client_body_temp_path temp/client_body;
  proxy_temp_path temp/proxy;
  include mime.types;
  # ---------- HTTP server 块 ----------
  # mapping: GitLab Web
  server {
    listen 8080;
    server_name git.example.com;
    location / {
      allow 192.168.1.0/24;
      allow 10.0.0.5;
      deny all;
      proxy_pass http://192.168.1.20:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

stream {
  log_format stream '$remote_addr [$time_local] $protocol $status $bytes_sent';
  access_log logs/stream_access.log stream;
  # mapping: MySQL 内网
  server {
    listen 9000;
    allow 192.168.1.0/24;
    allow 10.0.0.5;
    deny all;
    proxy_pass 192.168.1.10:3306;
  }
}

appId: com.nginx-jump-gui.app
productName: Nginx跳板机
# exe 文件名用纯英文，避免中文 exe 名在 Windows 上引发路径问题
executableName: NginxJump
directories:
  output: release
  buildResources: build
# native 模块必须从 asar 解包，否则 Windows 上 require .node 会失败
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/ssh2/**"
files:
  - out/**/*
  - package.json
  - "!**/.DS_Store"
win:
  target:
    # portable = 单 exe：NSIS 自解压，用户双击直接跑，数据写 exe 旁（PORTABLE_EXECUTABLE_DIR）。
    # macOS arm64 交叉打包不需要 wine（electron-builder 自带 NSIS 打包器）。
    - target: portable
      arch:
        - x64
  artifactName: NginxJump-${version}-win-x64
  icon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: NginxJump-${version}-${arch}.dmg
  icon: build/icon.icns
  category: public.app-category.developer-tools
extraResources:
  # 内置资源统一放 bundled/ 下：nginx 二进制 + 内置模板
  # app.asar / app.asar.unpacked 是 Electron 强制的，平铺在 resources/ 不动
  - from: resources/nginx
    to: bundled/nginx
    filter: ['**/*']
  - from: src/main/templates/builtin
    to: bundled/templates
    filter: ['**/*.yml']

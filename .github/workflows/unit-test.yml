name: Unit Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions: {}

jobs:
  test:
    # win + mac 双平台矩阵：测试套件（含 IPC e2e）必须跨平台全绿。
    # 不跑 build：桌面应用的完整构建需要 nginx/Node 二进制下载，CI 跑不了。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

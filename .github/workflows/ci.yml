name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # The packaging step builds the app the release workflow ships, on
        # the platform it ships it for — a PR that compiles but cannot be
        # packaged is caught here, before a tag ever runs the real thing.
        include:
          - os: macos-latest
            mygo-platform: darwin/universal
          - os: windows-latest
            mygo-platform: windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet every platform
        run: |
          go vet ./...
      - name: Unit and end-to-end tests
        run: go test ./... -race -count=1
      - name: Build the app
        run: |
          go build ./...
      - name: Package the app
        run: go tool mygo build -platform ${{ matrix.mygo-platform }}


[package]
name = "nginx-jump-gui"
version = "1.0.0"
description = "内网跳板机 nginx 管理软件 · Tauri 桌面壳（spawn Node sidecar + 开窗指向本地 HTTP server）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
